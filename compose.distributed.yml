name: anzen-distributed

x-app: &app
  build: .
  environment:
    NODE_ENV: production
    BETTER_AUTH_SECRET: docker-anzen-secret-change-me
    BETTER_AUTH_URL: http://localhost:3000
    DATABASE_PROVIDER: postgresql
    DATABASE_URL: postgres://anzen:anzen@postgres:5432/anzen
    EVENT_BUS_PROVIDER: redis
    EVENT_BUS_URL: redis://redis:6379
    CACHE_PROVIDER: memory
    STORAGE_PROVIDER: s3
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin
    S3_BUCKET: anzen
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: "true"
    SKIP_MIGRATE: "1"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rustfs:
      condition: service_healthy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: anzen
      POSTGRES_PASSWORD: anzen
      POSTGRES_DB: anzen
    volumes:
      - anzen_distributed_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anzen -d anzen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - anzen_distributed_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-perms:
    image: alpine:3.21
    volumes:
      - anzen_distributed_rustfs:/data
    command: sh -c "chown -R 10001:10001 /data"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - anzen_distributed_rustfs:/data
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  migrate:
    <<: *app
    entrypoint: ["bun", "run", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app-2:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2

volumes:
  anzen_distributed_postgres:
  anzen_distributed_redis:
  anzen_distributed_rustfs:
