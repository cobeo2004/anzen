name: anzen-memory

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BETTER_AUTH_SECRET: docker-anzen-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/data/anzen.sqlite
      EVENT_BUS_PROVIDER: memory
      CACHE_PROVIDER: memory
      STORAGE_PROVIDER: disk
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - anzen_memory_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  anzen_memory_data:
